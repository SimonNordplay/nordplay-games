<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Nordplay Games</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Cpath d='M11 8l12 8-12 8z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LÅS -->
<div id="lock">
  <div class="lock-box">
    <div class="wordmark"><span class="chev">▶</span> NORDPLAY <b>GAMES</b></div>
    <p class="lock-sub">Intern spelkatalog. Ange lösenord.</p>
    <form id="lockForm" autocomplete="off">
      <input id="pw" type="password" placeholder="Lösenord" autofocus>
      <button type="submit">Lås upp</button>
    </form>
    <p id="lockMsg"></p>
  </div>
</div>

<!-- APP -->
<div id="app" hidden>
  <header>
    <div class="hwrap">
      <a class="wordmark sm" href="#/"><span class="chev">▶</span> NORDPLAY <b>GAMES</b></a>
      <div class="hsearch"><input id="q" type="search" placeholder="Sök spel, provider, tema…"></div>
      <div class="hcount" id="count"></div>
    </div>
    <nav class="chips" id="chips"></nav>
  </header>

  <main>
    <div id="grid" class="grid"></div>
    <div id="sentinel"></div>
    <div id="empty" class="empty" hidden>Inga spel matchar.</div>
  </main>

  <footer>Nordplay Games · intern katalog · <span id="fcount"></span> spel</footer>
</div>

<!-- DETALJ -->
<div id="detail" hidden></div>

<script src="app.js"></script>
</body>
</html>
